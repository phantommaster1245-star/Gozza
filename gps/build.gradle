plugins { id 'com.android.library'; id 'org.jetbrains.kotlin.android'; id 'com.google.devtools.ksp'; id 'dagger.hilt.android.plugin'; id 'kotlin-parcelize' }
def tagName = '0.1.04'
def gozzaSigner(boolean release) {
 def cfg = project(':app').android.signingConfigs.findByName(release ? 'production' : 'debug')
 if (cfg == null || cfg.storeFile == null || !cfg.storeFile.exists()) return ''
 def ks = java.security.KeyStore.getInstance(release ? 'PKCS12' : java.security.KeyStore.getDefaultType())
 cfg.storeFile.withInputStream { ks.load(it, cfg.storePassword.toCharArray()) }
 return java.security.MessageDigest.getInstance('SHA-256').digest(ks.getCertificate(cfg.keyAlias).encoded).encodeHex().toString()
}

android {
 namespace 'io.github.phantom.gps'
 compileSdk 35
 defaultConfig {
  minSdk 27
  buildConfigField 'String', 'APPLICATION_ID', '"com.gozza.lalamove"'
  buildConfigField 'String', 'VERSION_NAME', '"0.1.47-gozza"'
  buildConfigField 'int', 'VERSION_CODE', '48'
        buildConfigField "String", "PUBLIC_SITE_BASE_URL", "\"https://geox-azure.vercel.app/\""
        buildConfigField "String", "MEMBERSHIP_PUBLIC_KEY", "\"\""
        buildConfigField("String", "TAG_NAME", "\"${tagName}\"")
        buildConfigField("String", "GITHUB_RELEASES_API_BASE", "\"https://api.github.com/repos/phantommaster1245-star/PHANToM-GPS/\"")
        buildConfigField("String", "GITHUB_RELEASES_PAGE", "\"https://github.com/phantommaster1245-star/PHANToM-GPS/releases\"")
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 buildFeatures { viewBinding true; buildConfig true }
 flavorDimensions += 'version'
 productFlavors { full { dimension 'version' } }
 buildTypes {
  debug { buildConfigField 'String', 'SIGNING_CERT_SHA256', '"' + gozzaSigner(false) + '"' }
  release { buildConfigField 'String', 'SIGNING_CERT_SHA256', '"' + gozzaSigner(true) + '"' }
 }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    fullImplementation 'androidx.work:work-runtime-ktx:2.9.0'

    // temporary foss xposed fix from https://github.com/deltazefiro/Amarok-Hider/issues/160
