plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'com.google.devtools.ksp'; id 'dagger.hilt.android.plugin' }

// Private signing material lives outside this checkout. Never fall back to debug signing.
def signingFile = file(System.getenv('FULLLOCK_SIGNING_PROPERTIES') ?: "${System.getProperty('user.home')}/.fulllock/signing/release.properties")
def releaseKeys = new Properties()
if (signingFile.exists()) signingFile.withInputStream { releaseKeys.load(it) }
def signingReady = ['storeFile','storePassword','keyAlias','keyPassword'].every { releaseKeys.getProperty(it) }
def signerSha256 = ''
if (signingReady) {
    def ks = java.security.KeyStore.getInstance('PKCS12')
    file(releaseKeys.storeFile).withInputStream { ks.load(it, releaseKeys.storePassword.toCharArray()) }
    signerSha256 = java.security.MessageDigest.getInstance('SHA-256').digest(ks.getCertificate(releaseKeys.keyAlias).encoded).encodeHex().toString()
}
android {
    namespace 'com.fulllock.app'
    compileSdk 35
    defaultConfig { applicationId 'com.gozza.lalamove'; minSdk 27; targetSdk 35; versionCode 53; versionName '0.1.52'; testInstrumentationRunner 'com.fulllock.app.ReadOnlyChecks' }
    defaultConfig { buildConfigField "boolean", "DEVICE_NOTIFICATION_CHECKS", project.hasProperty("deviceNotificationHarness") ? "true" : "false" }
    if (project.hasProperty("deviceNotificationHarness")) sourceSets.main.java.srcDir("src/deviceChecks/java")
    defaultConfig { buildConfigField "boolean", "PRIVATE_DISTRIBUTION", "true" }
    buildFeatures { buildConfig true }
    defaultConfig { missingDimensionStrategy 'version', 'full' }
    kotlinOptions { jvmTarget = '17' }
    signingConfigs {
        if (signingReady) {
            production {
                storeFile file(releaseKeys.storeFile)
                storePassword releaseKeys.storePassword
                keyAlias releaseKeys.keyAlias
                keyPassword releaseKeys.keyPassword
                storeType 'PKCS12'
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        debug {
            if (project.hasProperty('menuIssueChecks') || project.hasProperty('uiMotionChecks') || project.hasProperty('systemDiagnosticsChecks') || project.hasProperty('uiStabilityChecks') || project.hasProperty('visualControlsChecks') || project.hasProperty('pickupTesterChecks') || project.hasProperty('repeatControlsChecks') || project.hasProperty('relayProtocolChecks')) applicationIdSuffix '.qa'
            buildConfigField 'String', 'SIGNER_SHA256', '""'
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('deviceNotificationHarness')) proguardFiles 'proguard-device-checks.pro'
            buildConfigField 'String', 'SIGNER_SHA256', '"' + signerSha256 + '"'
            if (signingReady) signingConfig signingConfigs.production
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
tasks.configureEach {
    if (name == 'preReleaseBuild') doFirst {
        if (!signingReady) throw new GradleException('Release requires private signing properties. See docs/security.md; debug signing is not permitted.')
    }
}



android.sourceSets.main.java.srcDir(rootProject.file("shared/src/main/java"))

android.sourceSets.main.java.srcDir(rootProject.file("transport/src/main/java"))

if(project.hasProperty("menuIssueChecks")){dependencies {androidTestImplementation files(rootProject.file("driverprobe/libs/xposed-api-82.jar"))}}

dependencies { implementation project(':gps'); implementation 'com.google.dagger:hilt-android:2.55'; ksp 'com.google.dagger:hilt-compiler:2.55' }

